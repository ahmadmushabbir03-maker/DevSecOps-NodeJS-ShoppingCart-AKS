apiVersion: apps/v1
kind: Deployment
metadata:
  name: skypulse-app
  labels:
    app: skypulse-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skypulse-app
  template:
    metadata:
      labels:
        app: skypulse-app
    spec:
      containers:
      - name: skypulse-app
        image: ahmadweatheracr24486.azurecr.io/skypulse-weather-dashboard:17
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
